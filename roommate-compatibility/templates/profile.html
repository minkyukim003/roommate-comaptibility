<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white shadow-lg rounded-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-blue-600">Welcome, {{ name }}!</h1>
        </div>

        <div class="space-y-2">
            <h2 class="text-xl font-semibold text-gray-800">📄 Profile Information</h2>
            <p><strong>🎓 Major:</strong> {{ major }}</p>
            <p><strong>🎯 Hobby:</strong> {{ hobby }}</p>
        </div>

        <form method="POST" action="{{ url_for('results') }}" class="text-center mt-4">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-6 rounded-lg shadow transition duration-200">
                🔍 Compare!
            </button>
        </form>
    </div>

</body>
</html>
