<!DOCTYPE html>
<html>
<head>
    <title>Roommate Compatibility</title>
</head>
<body>
    <h1>Roommate Compatibility</h1>
    <form method="POST">
        {% for q in questions %}
        <label>{{ q }}</label><br>
        <input type="range" name="q{{ loop.index0 }}" min="1" max="10" step="1" oninput="showValue(this)" required>
        <span>5</span><br><br>
        {% endfor %}
        <button type="submit">Submit Quiz</button>
    </form>
</body>
<script>
    function showValue(slider){
        slider.nextElementSibling.textContent = slider.value;
    }
</script>
</html>
