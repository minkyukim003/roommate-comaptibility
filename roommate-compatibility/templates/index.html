<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Roomlytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
        theme: {
            extend: {
            colors: {
                primary: '#76944C',   // Green
                accent: '#C8DAA6',    // Yellow
                dark: '#2F4858',      // Dark text/nav
            },
            fontFamily: {
                sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            keyframes: {
                fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
                },
            },
            animation: {
                fadeIn: 'fadeIn 1.5s ease-out forwards',
            },
            },
        },
    };

  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
</head>
<body class="bg-white text-dark font-sans">

  <!-- Navigation -->
  <nav class="bg-white shadow-md sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <!-- Logo w/ Fade-In -->
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Roomlytics Logo" class="h-10 w-auto opacity-0 animate-fadeIn" />
      </div>
      <div class="space-x-6">
        <a href="{{ url_for('register') }}" class="text-dark hover:text-primary font-medium transition">Register</a>
        <a href="{{ url_for('login') }}" class="text-dark hover:text-primary font-medium transition">Login</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="flex items-center justify-center h-[85vh] text-center px-6 bg-gradient-to-b from-accent/40 to-white">
    <div class="max-w-2xl opacity-0 animate-fadeIn [animation-delay:0.5s]">
      <h2 class="text-5xl font-extrabold text-dark leading-tight mb-4">
        Smarter Roommate Matches, <br> Backed by Insight
      </h2>
      <p class="text-lg text-dark/70 mb-6">
        Roomlytics uses behavior-based compatibility to help you find your ideal roommate — no stress, just data-driven peace of mind.
      </p>
      <a href="{{ url_for('register') }}" class="inline-block bg-primary text-white px-8 py-3 rounded-xl shadow hover:bg-primary/90 transition font-semibold">
        Get Started
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-dark/50">
    &copy; 2025 Roomlytics. All rights reserved.
  </footer>

</body>
</html>
