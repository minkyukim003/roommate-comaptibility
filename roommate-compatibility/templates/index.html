<!DOCTYPE html>
<html>
<head>
    <title>Roommate Compatibility</title>
</head>
<body>
    <h1>Roommate Compatibility</h1>
    <form method="POST" action="/results" onsubmit="console.log(new FormData(this));">
        {% for q in questions %}
        <label>{{ q }}</label><br>
        You: <input type="range" name="user_{{ loop.index0 }}" min="1" max="10" required><br>
        Them: <input type="range" name ="other_{{ loop.index0 }}" min="1" max="10" required><br><br>
    {% endfor %}
    <button type="submit">See Results</button>
    </form>
</body>
</html>
