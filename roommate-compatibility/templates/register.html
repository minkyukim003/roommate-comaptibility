<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#76944C',
            accent: '#C8DAA6',
            dark: '#2F4858',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            fadeIn: 'fadeIn 1.5s ease-out forwards',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-white text-dark font-sans">

  <!-- Navigation -->
  <nav class="bg-white shadow-md sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Roomlytics Logo" class="h-10 w-auto opacity-0 animate-fadeIn" />
      </div>
      <div class="space-x-6">
        <a href="{{ url_for('register') }}" class="text-dark hover:text-primary font-medium transition">Register</a>
        <a href="{{ url_for('login') }}" class="text-dark hover:text-primary font-medium transition">Login</a>
      </div>
    </div>
  </nav>

  <!-- Register Form -->
  <section class="flex items-center justify-center min-h-screen px-6 py-12">
    <div class="bg-white shadow-lg rounded-2xl max-w-md w-full p-8 space-y-6 border border-accent/40 animate-fadeIn">
      <h1 class="text-3xl font-extrabold text-primary text-center">Create an Account</h1>

      <form method="POST" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-dark">Username</label>
          <input 
            type="text" 
            name="username" 
            id="username" 
            required 
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary focus:outline-none"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-dark">Password</label>
          <input 
            type="password" 
            name="password" 
            id="password" 
            required 
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary focus:outline-none"
          >
        </div>

        <button 
          type="submit" 
          class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow"
        >
          🚀 Register
        </button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-dark/50">
    &copy; 2025 Roomlytics. All rights reserved.
  </footer>

</body>
</html>
