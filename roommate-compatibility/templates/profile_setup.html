<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white shadow-lg rounded-2xl max-w-md w-full p-8 space-y-6">
        <h1 class="text-3xl font-bold text-blue-600 text-center">Tell Us About Yourself</h1>

        <form method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input 
                    type="text" 
                    name="name" 
                    id="name" 
                    required 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                >
            </div>

            <div>
                <label for="major" class="block text-sm font-medium text-gray-700">Major</label>
                <input 
                    type="text" 
                    name="major" 
                    id="major" 
                    required 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                >
            </div>

            <div>
                <label for="hobby" class="block text-sm font-medium text-gray-700">Hobby</label>
                <input 
                    type="text" 
                    name="hobby" 
                    id="hobby" 
                    required 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg shadow transition duration-200"
            >
                ✅ Continue
            </button>
        </form>
    </div>

</body>
</html>
